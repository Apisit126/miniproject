<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b241e">
  <title>กระดานคะแนนฟุตบอล | Matchday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: dark;
  --bg: #071a16;
  --surface: #102923;
  --surface-soft: #17362e;
  --line: rgba(223, 244, 233, .12);
  --text: #f1f8f3;
  --muted: #9ab2a5;
  --lime: #c9f36a;
  --lime-dark: #a5d747;
  font-family: "Prompt", sans-serif;
}

* { box-sizing: border-box; }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background: radial-gradient(ellipse at 50% 0%, #173b2e 0%, var(--bg) 54%);
}
button, input { font: inherit; }
button { color: inherit; }
.page-shell { width: min(100% - 40px, 1040px); min-height: 100vh; margin: auto; display: flex; flex-direction: column; }
.topbar { height: 82px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font: 700 18px "Kanit", sans-serif; letter-spacing: 1.6px; }
.brand-mark { font-size: 24px; }
.brand-accent { color: var(--lime); }
.live-label { display: flex; align-items: center; gap: 9px; color: #b8c9bf; font-size: 11px; letter-spacing: 1.5px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px #c9f36a; }
.scoreboard { width: 100%; max-width: 840px; margin: 0 auto; padding: 55px 0 42px; text-align: center; }
.section-heading { margin-bottom: 30px; }
.eyebrow { margin: 0 0 9px; color: var(--lime); font: 500 11px "Kanit", sans-serif; letter-spacing: 2px; }
h1 { margin: 0; font: 600 clamp(30px, 5vw, 43px) "Kanit", sans-serif; letter-spacing: .3px; }
h1 span { color: var(--lime); margin-left: 9px; }
.subtitle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
.match-card { padding: 22px 28px 25px; border: 1px solid rgba(221, 244, 229, .13); border-radius: 22px; background: linear-gradient(145deg, rgba(24, 55, 45, .94), rgba(12, 35, 29, .97)); box-shadow: 0 22px 70px rgba(0, 0, 0, .22); }
.match-meta { display: flex; justify-content: center; align-items: center; gap: 12px; color: #b2c5b9; font-size: 11px; letter-spacing: .3px; }
.meta-divider { width: 3px; height: 3px; border-radius: 50%; background: var(--lime); }
.teams { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: center; gap: 15px; padding: 26px 0 23px; }
.team-card { min-width: 0; padding: 18px 14px 15px; border: 1px solid var(--line); border-radius: 17px; background: rgba(4, 19, 15, .26); transition: border-color .2s, transform .2s, background .2s; }
.team-card.is-leading { border-color: rgba(201, 243, 106, .55); background: rgba(201, 243, 106, .06); }
.team-crest { width: 64px; height: 64px; margin: 0 auto 9px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 0 0 5px rgba(255,255,255,.04); font-size: 30px; }
.crest-home { background: linear-gradient(145deg, #542d35, #241d29); }
.crest-away { background: linear-gradient(145deg, #234b63, #1b2739); }
.team-label { display: block; color: var(--muted); font-size: 11px; }
.team-name { display: block; width: min(100%, 230px); margin: 3px auto 0; padding: 2px 5px; border: 0; border-bottom: 1px solid transparent; outline: 0; background: transparent; color: var(--text); text-align: center; font: 500 clamp(15px, 2.5vw, 20px) "Kanit", sans-serif; }
.team-name:focus { border-color: var(--lime); }
.score { margin-top: 3px; color: var(--text); font: 600 clamp(60px, 10vw, 86px)/1.15 "Kanit", sans-serif; font-variant-numeric: tabular-nums; }
.score-caption { margin: -1px 0 13px; color: var(--muted); font-size: 11px; }
.score-actions { display: flex; justify-content: center; gap: 8px; }
.score-button { min-width: 65px; padding: 7px 9px 6px; border: 1px solid rgba(201, 243, 106, .32); border-radius: 10px; background: rgba(201, 243, 106, .07); cursor: pointer; transition: transform .15s, background .15s, border-color .15s; }
.score-button:hover { transform: translateY(-2px); border-color: var(--lime); background: rgba(201, 243, 106, .16); }
.score-button:active { transform: translateY(0) scale(.97); }
.score-button span { display: block; color: var(--lime); font: 600 18px "Kanit", sans-serif; line-height: 1.1; }
.score-button small { color: #a9bbaf; font-size: 9px; }
.score-button.remove-button { border-color: rgba(255, 130, 130, .28); background: rgba(255, 110, 110, .06); }
.score-button.remove-button span { color: #ff9b9b; }
.score-button.remove-button:hover { border-color: #ff9b9b; background: rgba(255, 110, 110, .14); }
.versus { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #d1ddcf; font: 600 15px "Kanit", sans-serif; }
.versus i { width: 3px; height: 3px; border-radius: 50%; background: #789181; }
.match-footer { display: flex; justify-content: center; gap: 10px; padding-top: 19px; border-top: 1px solid var(--line); }
.winner-button, .reset-button { min-height: 43px; padding: 0 18px; border-radius: 10px; cursor: pointer; transition: transform .15s, filter .15s, background .15s; }
.winner-button:hover, .reset-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
.winner-button { border: 0; background: var(--lime); color: #14200e; font-weight: 600; }
.winner-button span { margin-right: 5px; }
.reset-button { border: 1px solid var(--line); background: rgba(255,255,255,.035); color: #d2dfd5; }
.reset-button span { margin-right: 4px; font-size: 18px; vertical-align: -1px; }
.result { margin-top: 17px; padding: 15px; border: 1px solid rgba(201,243,106,.35); border-radius: 12px; background: rgba(201,243,106,.08); color: var(--text); font: 500 17px "Kanit", sans-serif; animation: rise .25s ease-out; }
.result[hidden] { display: none; }
.result strong { color: var(--lime); }
.hint { margin: 18px 0 0; color: #82988b; font-size: 11px; }
.hint span { margin-right: 5px; }
.footer { margin-top: auto; min-height: 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); color: #789083; font-size: 10px; letter-spacing: .3px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) {
  .page-shell { width: min(100% - 24px, 480px); }
  .topbar { height: 66px; }
  .scoreboard { padding: 37px 0 28px; }
  .section-heading { margin-bottom: 22px; }
  .subtitle { font-size: 12px; }
  .match-card { padding: 18px 12px 18px; border-radius: 17px; }
  .teams { grid-template-columns: 1fr 31px 1fr; gap: 5px; padding: 21px 0 17px; }
  .team-card { padding: 14px 5px 12px; border-radius: 13px; }
  .team-crest { width: 52px; height: 52px; font-size: 25px; }
  .score-actions { gap: 4px; }
  .score-button { min-width: 0; flex: 1; padding: 6px 3px 5px; }
  .score-button span { font-size: 16px; }
  .versus { font-size: 12px; }
  .match-footer { gap: 7px; }
  .winner-button, .reset-button { padding: 0 11px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Matchday หน้าหลัก">
        <span class="brand-mark" aria-hidden="true">⚽</span>
        <span>MATCH<span class="brand-accent">DAY</span></span>
      </a>
      <span class="live-label"><span class="live-dot"></span> MATCH CENTER</span>
    </header>

    <section class="scoreboard" aria-labelledby="page-title">
      <div class="section-heading">
        <p class="eyebrow">สนามแข่งขัน · MATCH 01</p>
        <h1 id="page-title">กระดานคะแนน<span>ฟุตบอล</span></h1>
        <p class="subtitle">เลือกทีมที่ทำประตู แล้วมาเชียร์ไปด้วยกัน!</p>
      </div>

      <div class="match-card">
        <div class="match-meta"><span>กระชับมิตร</span><span class="meta-divider"></span><span>90 นาที</span></div>
        <div class="teams">
          <article class="team-card" data-team="home">
            <div class="team-crest crest-home" aria-hidden="true"><span>🔴</span></div>
            <label class="team-label" for="home-name">เจ้าบ้าน</label>
            <input id="home-name" class="team-name" value="ทีมเจ้าบ้าน" maxlength="20" aria-label="ชื่อทีมเจ้าบ้าน">
            <div class="score" id="home-score" aria-live="polite">0</div>
            <p class="score-caption">ประตู</p>
            <div class="score-actions" aria-label="ปรับคะแนนทีมเจ้าบ้าน">
              <button class="score-button remove-button" data-side="home" data-points="-1" aria-label="ลบ 1 คะแนนทีมเจ้าบ้าน"><span>−1</span><small>ลบแต้ม</small></button>
              <button class="score-button" data-side="home" data-points="1"><span>+1</span><small>ประตู</small></button>
              <button class="score-button" data-side="home" data-points="2"><span>+2</span><small>แต้ม</small></button>
              <button class="score-button" data-side="home" data-points="3"><span>+3</span><small>แต้ม</small></button>
            </div>
          </article>

          <div class="versus" aria-label="พบกับ"><span>VS</span><i></i><i></i><i></i></div>

          <article class="team-card" data-team="away">
            <div class="team-crest crest-away" aria-hidden="true"><span>🔵</span></div>
            <label class="team-label" for="away-name">ทีมเยือน</label>
            <input id="away-name" class="team-name" value="ทีมเยือน" maxlength="20" aria-label="ชื่อทีมเยือน">
            <div class="score" id="away-score" aria-live="polite">0</div>
            <p class="score-caption">ประตู</p>
            <div class="score-actions" aria-label="ปรับคะแนนทีมเยือน">
              <button class="score-button remove-button" data-side="away" data-points="-1" aria-label="ลบ 1 คะแนนทีมเยือน"><span>−1</span><small>ลบแต้ม</small></button>
              <button class="score-button" data-side="away" data-points="1"><span>+1</span><small>ประตู</small></button>
              <button class="score-button" data-side="away" data-points="2"><span>+2</span><small>แต้ม</small></button>
              <button class="score-button" data-side="away" data-points="3"><span>+3</span><small>แต้ม</small></button>
            </div>
          </article>
        </div>

        <div class="match-footer">
          <button class="winner-button" id="winner-button"><span aria-hidden="true">🏆</span> แสดงทีมที่ชนะ</button>
          <button class="reset-button" id="reset-button"><span aria-hidden="true">↻</span> รีเซ็ตคะแนน</button>
        </div>
      </div>

      <div class="result" id="result" role="status" aria-live="assertive" hidden></div>
      <p class="hint"><span aria-hidden="true">⚽</span> คะแนนจะอัปเดตทันทีเมื่อกดปุ่ม</p>
    </section>

    <footer class="footer"><span>เล่นให้สนุก แล้วมีน้ำใจนักกีฬา</span><span>© MATCHDAY</span></footer>
  </main>
  <script>
const scores = { home: 0, away: 0 };
const scoreElements = {
  home: document.querySelector('#home-score'),
  away: document.querySelector('#away-score'),
};
const teams = {
  home: { card: document.querySelector('[data-team="home"]'), name: document.querySelector('#home-name') },
  away: { card: document.querySelector('[data-team="away"]'), name: document.querySelector('#away-name') },
};
const result = document.querySelector('#result');

function renderScores() {
  for (const side of ['home', 'away']) scoreElements[side].textContent = scores[side];
  teams.home.card.classList.toggle('is-leading', scores.home > scores.away);
  teams.away.card.classList.toggle('is-leading', scores.away > scores.home);
}

document.querySelectorAll('.score-button').forEach((button) => {
  button.addEventListener('click', () => {
    const side = button.dataset.side;
    scores[side] = Math.max(0, scores[side] + Number(button.dataset.points));
    result.hidden = true;
    renderScores();
  });
});

document.querySelector('#winner-button').addEventListener('click', () => {
  result.hidden = false;
  if (scores.home === scores.away) {
    result.textContent = `🤝 ผลการแข่งขันเสมอกัน ${scores.home} – ${scores.away}`;
    return;
  }
  const winner = scores.home > scores.away ? 'home' : 'away';
  const winningName = teams[winner].name.value.trim() || (winner === 'home' ? 'ทีมเจ้าบ้าน' : 'ทีมเยือน');
  result.innerHTML = `🏆 ผู้ชนะคือ <strong></strong> ด้วยคะแนน ${scores[winner]} – ${scores[winner === 'home' ? 'away' : 'home']}`;
  result.querySelector('strong').textContent = winningName;
});

document.querySelector('#reset-button').addEventListener('click', () => {
  scores.home = 0;
  scores.away = 0;
  result.hidden = true;
  renderScores();
});

  </script>
</body>
</html>
